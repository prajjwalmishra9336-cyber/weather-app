```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <div class="weather-card">

            <h1>Weather App</h1>
            <p class="subtitle">Check the current weather anywhere</p>

            <form id="weatherForm" class="search-box">
                <input
                    type="text"
                    id="locationInput"
                    placeholder="Enter city, e.g. London"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Search
                </button>
            </form>

            <div id="loading" class="loading hidden">
                Loading weather...
            </div>

            <div id="error" class="error hidden"></div>

            <section id="weatherResult" class="weather-result hidden">

                <div class="location">
                    <h2 id="cityName">London</h2>
                    <p id="countryName">United Kingdom</p>
                </div>

                <div class="weather-main">

                    <img
                        id="weatherIcon"
                        src=""
                        alt="Weather condition"
                    >

                    <div>
                        <div class="temperature">
                            <span id="temperature">--</span>°C
                        </div>

                        <p id="condition">--</p>
                    </div>

                </div>

                <div class="weather-details">

                    <div class="detail">
                        <span>Feels like</span>
                        <strong id="feelsLike">--°C</strong>
                    </div>

                    <div class="detail">
                        <span>Humidity</span>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="detail">
                        <span>Wind</span>
                        <strong id="wind">-- km/h</strong>
                    </div>

                    <div class="detail">
                        <span>Updated</span>
                        <strong id="updated">--</strong>
                    </div>

                </div>

            </section>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
```
